<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#0e1015;--panel:#161922;--panel2:#1d212c;--line:#2a2f3c;--text:#e9ebf1;--muted:#8d94a6;
  --accent:#c9b6ff;--good:#6fdc9a;--warn:#ffd166;--bad:#ff7a7a;--radius:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.snap-area p,.snap-area li{max-height:1000000px} /* opts long text out of Android font boosting */
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700}
h3{font-size:15px;font-weight:700;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden,[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(14,16,21,.94);backdrop-filter:blur(8px)}
.logo{font-weight:800;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px}
.logo .dot{width:18px;height:18px;border-radius:50%;background:conic-gradient(#5aa9ff 0 50%,#ff5a5f 50% 100%);box-shadow:0 0 0 3px #0e1015,0 0 0 4px #2a2f3c}
.top .sp{flex:1}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 53px)}
aside{border-right:1px solid var(--line);padding:16px 14px;overflow:auto;position:sticky;top:53px;height:calc(100vh - 53px)}
main{padding:22px 26px 60px;min-width:0}
@media (max-width:880px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:16px}
}

/* controls */
.btn,button.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#3d4456;background:#232837}
.btn.primary{background:var(--accent);color:#17131f;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-size:12px}
input[type=text],input[type=number],input:not([type]),select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.wrap{flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#2c3242;color:var(--text);font-weight:600}

/* sidebar */
.sect{margin-bottom:18px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:block;margin-bottom:6px}
.lbl-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lbl-row .lbl{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:6px;background:var(--panel)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.add{cursor:pointer;color:var(--muted)}
.chip.add::before{display:none}
.band{margin-bottom:10px}
.band-row{display:flex;align-items:center;gap:2px}
.band-row .band-name{flex:1;min-width:0}
.band-name .t{flex:1;min-width:0;display:flex;flex-direction:column}
.band-name .n,.band-name .s{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band-name .s{font-size:11px;font-weight:400;color:var(--muted)}
.band-name .avgs{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:8px}
.band-name .avgs i{font-style:normal}
.chev{background:none;border:0;color:var(--muted);cursor:pointer;width:22px;height:28px;flex:none;font-size:12px;border-radius:6px}
.chev:hover{color:var(--text);background:var(--panel2)}
.band-name{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:6px 8px;border-radius:8px;cursor:pointer;font-weight:700;text-align:left}
.band-name:hover,.band-name.active{background:var(--panel2)}
.alb{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;padding:5px 8px;border-radius:8px;cursor:pointer;text-align:left}
.alb:hover{background:var(--panel)}
.alb.active{background:var(--panel2)}
.alb .t{flex:1;min-width:0;display:flex;flex-direction:column}
.alb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.alb .s{font-size:11px;color:var(--muted)}
.alb .avgs{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;font-style:normal;font-variant-numeric:tabular-nums}
.alb .avgs i{font-style:normal}
.cover{border-radius:6px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:rgba(255,255,255,.85);letter-spacing:-.02em;overflow:hidden}
.cover.big{border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45)}

/* cards & album header */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.snap-area{padding:22px;border-radius:18px;background:var(--bg)}
.album-head{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.head-info{flex:1;min-width:240px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:4px}
.overall{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.oc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:12px;padding:9px 14px;min-width:120px}
.oc-n{font-size:12px;color:var(--muted);font-weight:600}
.oc-v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--text));letter-spacing:-.02em}
.oc-s{font-size:11px;color:var(--muted)}
.oc-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-tag{display:inline-block;margin-top:5px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;line-height:1.6;white-space:nowrap}
.oc-tag.re{color:#ffd166;background:rgba(255,209,102,.15);border:1px solid rgba(255,209,102,.55)}
.oc-tag.first{color:#6fdc9a;background:rgba(111,220,154,.12);border:1px solid rgba(111,220,154,.45)}
.listen-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 10px}
.lt{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 3px 2px 10px;background:var(--panel)}
.lt b{color:var(--c);font-weight:700;white-space:nowrap}
.lt select{width:auto;padding:2px 6px;font-size:12px;border-radius:999px}
/* rating history */
.hist-cards{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hc{background:var(--panel);border:1px solid var(--line);border-top:3px solid #3a4152;border-radius:12px;padding:9px 13px;min-width:118px}
.hc.now{border-top-color:var(--c)}
.hc-n{font-size:12px;font-weight:700}
.hc-d{font-size:11px;color:var(--muted)}
.hc-v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--c)}
.hc-s{font-size:11px;color:var(--muted)}
.hc-arrow{align-self:center;color:var(--muted);font-size:16px}
.htab input.hscore{width:54px;text-align:center;padding:4px 2px;font-weight:600;font-variant-numeric:tabular-nums}
.htab input.hscore.bad{border-color:var(--bad)}
.htab .hd{display:flex;gap:4px;align-items:center;justify-content:center;margin-top:3px}
.htab .hd input{width:auto;padding:2px 4px;font-size:11px}
.hdel{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px}
.hdel:hover{color:var(--bad)}
@media (max-width:700px){.hc-arrow{display:none}.hc{flex:1 1 120px}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--panel2);color:var(--text);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.dropbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.dropbar select{width:auto}

/* ratings table */
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
@media (max-width:1100px){.rgrid{grid-template-columns:1fr}}
table.rt{width:100%;border-collapse:collapse}
.rt th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.rt td{padding:5px 8px;border-bottom:1px solid #1f2330;vertical-align:middle}
.rt tr:hover td{background:#141720}
.rt .num{color:var(--muted);width:28px;font-variant-numeric:tabular-nums}
.rt .tt{font-weight:500}
.rt .len{color:var(--muted);font-variant-numeric:tabular-nums;width:48px}
.rt input.score{width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:5px 4px}
.rt input.score.bad{border-color:var(--bad)}
.rt input.score.dropped{text-decoration:line-through;opacity:.45}
.rt tr.row-dropped .tt{text-decoration:line-through;opacity:.5}
.rt tr.row-off .tt{text-decoration:line-through;opacity:.5}.rt tr.row-off td.sc,.rt tr.row-off .len{opacity:.45}
.offbtn{display:block;margin-top:2px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:none;color:var(--muted);font-size:11px;cursor:pointer}
.offbtn{opacity:.55}.offbtn:hover{color:var(--text);opacity:1}
.rt tr.row-off .offbtn{border-color:var(--warn);color:var(--warn)}
.delta{font-weight:700;font-variant-numeric:tabular-nums;width:56px;text-align:right}
.bars{width:110px}
.bar{height:5px;border-radius:3px;margin:2px 0}
.side-sum .card{padding:14px}
.sum-grid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
@media (max-width:1100px){.sum-grid{grid-template-columns:minmax(0,1fr)}}
.sum-grid > div{min-width:0}
.sum-side .card,.sum-row .card{padding:14px}.sum-side h3,.sum-row h3{font-size:13px}
.sum-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:16px}
.sum-head{align-items:center;gap:12px;margin-bottom:14px}
.part-only{display:none}.snapping-part .part-only{display:flex}
.snapping-part #sumSnap{padding:20px;background:var(--bg)}
table.sumtab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sumtab th{font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.sumtab td{padding:4px;border-bottom:1px solid #1f2330;text-align:center;font-size:13.5px}
.sumtab .l{text-align:left;min-width:120px;font-weight:500}
.sumtab .rk{color:var(--muted);width:40px;text-align:left}
.sumtab .pill{display:inline-block;min-width:38px;padding:4px 5px;border-radius:7px;font-weight:600}
.sumtab .drop .pill{text-decoration:line-through;opacity:.4}
.pill.star1,.pill.star2{background:linear-gradient(160deg,#2a8a52 0%,#186a3b 45%,#0f4f2b 55%,#1c7543 100%);color:#fff}
.pill.star1{box-shadow:inset 0 0 0 2px #d9dde3}
.pill.star2{box-shadow:inset 0 0 0 2px #ffd34d,0 0 10px 1px rgba(255,200,60,.75)}
details.tiemore{margin-top:6px}
details.tiemore>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none}
details.tiemore>summary::-webkit-details-marker{display:none}
details.tiemore[open] .tm-a{display:inline-block;transform:rotate(90deg)}
details.tiemore .dlist{margin-top:4px}
.sumtab .pill.skip{color:var(--muted);border:1px dashed var(--line)}
.kpi .agree{display:grid;gap:5px;margin-top:6px}
.kpi-agree{grid-column:span 2}
.kpi .agree > div{display:grid;grid-template-columns:76px minmax(0,1fr) 26px;align-items:center;gap:8px;font-size:12px}
.kpi .agree span{color:var(--muted);white-space:nowrap}
.kpi .agree i{display:block;height:6px;border-radius:3px;background:#262b37;overflow:hidden}
.kpi .agree i b{display:block;height:100%;border-radius:3px;background:var(--both-c,#c9b6ff)}
.kpi .agree em{font-style:normal;font-weight:800;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.dlist li.sep{border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.sumtab tr.row-drop .l{text-decoration:line-through;opacity:.5}
.sumtab .avg{font-weight:800}.sumtab .gap{font-weight:700}
/* phones: rank + track stay put while the scores scroll sideways */
@media (max-width:700px){.sumtab .rk,.sumtab .l{position:sticky;background:var(--panel);z-index:1}.sumtab .rk{left:0;min-width:40px;width:40px;padding-left:8px}.sumtab .l{left:40px;min-width:104px;max-width:104px}.sum-grid > div > .card{padding-left:0!important}}
.side-sum h3{font-size:13px}
.dlist{list-style:none;margin:0;padding:0}
.dlist li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #252a36;font-size:13px}
.dlist li span:first-child{min-width:0}
.dlist b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* rankings */
.rank-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rank-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
ol.rank-list{list-style:none;margin:0;padding:0}
.rank-list li{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px;background:var(--panel2);cursor:grab}
.rank-list li.over{border-color:var(--accent)}
.rank-list .rk{font-weight:800;width:30px;font-variant-numeric:tabular-nums}
.rank-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-list .sv{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.rank-list .mv button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 3px}
.rank-list .mv button:hover{color:var(--text)}
.rank-list .mv .tie{font-weight:800;border-radius:5px;margin-right:2px}
.rank-list .mv .tie.on{color:var(--warn);background:#2c3242}

/* best of */
.best{display:grid;gap:8px 12px;align-items:start}
.bh{font-weight:700;font-size:13px;overflow-wrap:anywhere;min-width:0}
.all-artists{margin-bottom:8px;border:1px dashed var(--line)}
.link-row{background:none;border:0;padding:0;color:var(--text);font-weight:600;cursor:pointer;text-align:left;font-size:inherit}
.link-row:hover{color:var(--accent)}
.arttab .l2{text-align:left;font-size:12.5px;white-space:nowrap}
.viewer .link-row{pointer-events:none;cursor:default}
.viewer .vtabs ~ * .link-row,.viewer .vtabs ~ .link-row{pointer-events:auto;cursor:pointer}
.viewer .vtabs{top:0}
.mob-only{display:none}
/* phones: charts are drawn ~560 wide and shrunk to half, so their text gets bigger to stay readable */
@media (max-width:700px){body:not(.snapping) .chart text[font-size="9.5"]{font-size:12px}body:not(.snapping) .chart text[font-size="10"]{font-size:12.5px}body:not(.snapping) .chart text[font-size="11"]{font-size:13.5px}body:not(.snapping) .chart text[font-size="12"]{font-size:14px}body:not(.snapping) .chart text[font-size="13"]{font-size:15px}body:not(.snapping) .chart text[font-size="14"]{font-size:16px}}
@media (max-width:700px){.mob-hide{display:none}.mob-only{display:block;font-weight:400}.alltab .l{min-width:0}}
.tnlist{margin-top:10px;font-variant-numeric:tabular-nums}
.tnr{display:grid;grid-template-columns:48px repeat(var(--c),minmax(0,1fr)) 18px;align-items:center;gap:6px;padding:4px 6px;text-align:center;font-size:13.5px}
.tnhead{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.tnhead span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnrow summary{list-style:none;cursor:pointer;border-bottom:1px solid #1f2330}
.tnrow summary::-webkit-details-marker{display:none}
.tnrow summary:hover{background:#1c2030}
.tnrow .tnk{text-align:left;color:var(--muted);font-weight:600}
.tnrow .tnar{color:var(--muted);font-size:14px;line-height:1}
.tnrow[open] .tnar{transform:rotate(180deg)}
.tnrow[open] summary{background:#1c2030}
.tnsongs{padding:4px 8px 10px 54px}
.tnlist .pill,.alltab .pill{display:inline-block;min-width:38px;padding:3px 5px;border-radius:7px;font-weight:600;justify-self:center}
.tnk4{margin-bottom:12px}
.difftab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.difftab th{font-size:12px;color:var(--muted);font-weight:600;padding:4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.difftab td{padding:5px 4px;border-bottom:1px dashed #252a36;text-align:center;font-size:13px}
.difftab .l{text-align:left;width:100%}
.difftab .dsc{min-width:44px}
.gapchip{display:inline-block;min-width:44px;padding:3px 6px;border-radius:7px;font-weight:700}
.tnr .gp{font-weight:700}
@media (max-width:700px){.tnsongs{padding-left:8px}
  .tnr{grid-template-columns:26px repeat(var(--cm),minmax(0,1fr)) 12px;gap:3px;padding:4px 2px;font-size:12.5px}.tnr .tns{display:none}
  .tnlist .pill{min-width:0;width:100%;max-width:42px;padding:3px 2px;font-size:12.5px}}
.bl{font-size:13px;color:var(--muted);padding-top:7px}
.match{display:block;font-size:11px;color:var(--good);font-weight:600}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.kpi .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-bottom:16px;align-items:start}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.hl .card{padding:12px 14px}
.hl .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hl .t{font-weight:700;margin:3px 0}
.insights{margin:0;padding-left:18px}
.insights li{margin:3px 0}

.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.kpis.k4{grid-template-columns:1fr 1fr}}
.kpis.kg{grid-template-columns:repeat(var(--kc),minmax(0,1fr))}

function overallCards(al) {
  const [A, B] = pair(), P = vis();
  let h = P.map(p => {
    const raw = rawAvg(al, p.id), adj = S.ui.drop ? overall(al, p.id) : null;
    const lt = P.length > 1 ? al.listen?.[p.id] : null; // first listen / re-listen tag, duo and group views only
    return `<div class="oc" style="--c:${p.color}"><div class="oc-n" title="${esc(p.name)}">${pn(p, 16)}</div><div class="oc-v">${fmt2(adj ?? raw)}</div><div class="oc-s">${adj != null ? `${adj - raw >= 0 ? '+' : '−'}${fmt2(Math.abs(adj - raw))} · ${adj - raw >= 0 ? '+' : '−'}${(Math.abs(adj - raw) / raw * 100).toFixed(1)}% vs ${fmt2(raw)} with all` : `${ratedCount(al, p.id)}/${al.tracks.length} rated${skipCount(al, p.id) ? ` · ${skipCount(al, p.id)} skipped` : ''}`}</div>${lt === 're' || lt === 'first' ? `<div class="oc-tag ${lt}">${lt === 're' ? 'Re-listen' : 'First listen'}</div>` : ''}</div>`;
  }).join('');
  if (B) {
    const ag = agreement(pairRows(al, A, B));
    if (ag) h += `<div class="oc" style="--c:${PAL.both}"><div class="oc-n">Score match</div><div class="oc-v">${ag.match}%</div><div class="oc-s">avg gap ${fmt2(ag.mad)} per track</div></div>`;
  } else if (P.length > 2) {

    if (gm != null) h += `<div class="oc" style="--c:${PAL.both}"><div class="oc-n">Group match</div><div class="oc-v">${gm}%</div><div class="oc-s">across ${pairs.length} pairs</div></div>`;
  }
  if (P.length > 1) { // everyone's album score averaged (follows "drop worst" like the person cards)
    const vals = P.map(p => S.ui.drop ? overall(al, p.id) : rawAvg(al, p.id)).filter(v => v != null);
    if (vals.length > 1) h += `<div class="oc" style="--c:${PAL.both}"><div class="oc-n">Album average</div><div class="oc-v">${fmt2(avg(vals))}</div><div class="oc-s">${vals.length < P.length ? `${vals.length} of ${P.length} people` : `average of ${vals.length} people`}${S.ui.drop ? ` · without worst ${S.ui.drop}` : ''}</div></div>`;
  }
  return h;
}

async function capture(id = 'snapArea') {
  if (!window.html2canvas) { toast('Image export needs an internet connection to load its helper.'); return null; }
  const narrow = PHONE(); if (narrow) { WIDE = true; rerender(); } // phone charts are drawn narrower: redraw them full width for the image
  try { return await captureEl(id); } finally { if (narrow) { WIDE = false; rerender(); } }
}
async function captureEl(id) {
  const el = document.getElementById(id); if (!el) return null;
  document.body.classList.add('snapping'); if (id !== 'snapArea') document.body.classList.add('snapping-part');
  try { return await html2canvas(el, { backgroundColor: '#0e1015', scale: 2, useCORS: true, logging: false, windowWidth: 1400, windowHeight: 900, onclone: async d => {
    const e = d.getElementById(id); if (!e) return;
    balanceCols(d); // the copy is 1400px wide: two columns again even when taken on a phone
    // Text is laid out in this hidden copy, then drawn with the main page's fonts. If Inter hasn't loaded here yet
    // (common on phones) the widths disagree and words come out spread apart, so wait for it, or use system fonts in both.
    const interReady = () => [...d.fonts].some(f => /inter/i.test(f.family) && f.status === 'loaded') && [...document.fonts].some(f => /inter/i.test(f.family) && f.status === 'loaded');
    try { await Promise.race([Promise.all(['400', '500', '600', '700', '800'].map(w => d.fonts.load(`${w} 16px Inter`))), new Promise(r => setTimeout(r, 2500))]); } catch (err) {}
    // html2canvas paints an inset box-shadow as a solid fill: star pills get a real border in the image instead
    const sp = d.createElement('style'); sp.textContent = '.pill.star1,.pill.star2{border:2px solid #d9dde3;box-shadow:none!important}.pill.star2{border-color:#ffd34d;box-shadow:0 0 8px rgba(255,200,60,.7)!important}'; d.head.appendChild(sp);
    if (!interReady()) { const st = d.createElement('style'); st.textContent = '*{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important}'; d.head.appendChild(st); }
    // Android Chrome "font boosting" enlarges long paragraphs in this 1400px-wide copy, which spreads their words apart
    // once drawn at normal size. Anything with a max-height is never boosted, so give everything one.
    const nb = d.createElement('style'); nb.textContent = '*{max-height:1000000px}'; d.head.appendChild(nb);
    e.style.width = '960px'; e.style.maxWidth = 'none';
    // big groups: if any box (e.g. a ratings table with many people) is wider than its card, widen the whole image to fit
    const scrollers = () => [...e.querySelectorAll('.card')].concat([...e.querySelectorAll('div')].filter(x => /auto|scroll/.test(d.defaultView.getComputedStyle(x).overflowX)));
    for (let k = 0; k < 8; k++) {
      const over = Math.max(0, ...scrollers().map(c => c.scrollWidth - c.clientWidth));
      if (over <= 1) break;
      e.style.width = (parseFloat(e.style.width) + over + 24) + 'px';
    }
    // pin every chart to the size it lays out at, otherwise html2canvas draws SVGs at their viewBox size and they spill out of their box
    // (it also copies them at the live page's width, which on a phone is far narrower than the 960px card)
    d.querySelectorAll('svg.chart').forEach(s => {
      const p = s.parentElement, cs = d.defaultView.getComputedStyle(p);
      const w = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), vb = s.viewBox.baseVal, h = w * vb.height / vb.width;
      s.setAttribute('width', w); s.setAttribute('height', h); s.style.width = w + 'px'; s.style.height = h + 'px';
    });
  } }); }
  catch (e) { toast('Could not capture the image: ' + e.message); return null; }
  finally { document.body.classList.remove('snapping', 'snapping-part'); }
}

// Notion-style track line: "- **9. I Need You (For Someone) (2:41) - 8**" (bullet, bold, score and length all optional)
const NOTION_TRACK = /^(\d{1,3})[.)]\s*(.+?)(?:\s*\((\d{1,2}:\d{2})\))?\s*(?:[-–—:|]\s*(?:\d{1,2}(?:[.,]\d+)?)?)?\s*$/;
const cleanNotion = l => l.replace(/\*\*|__/g, '').replace(/^\s*[-*•]\s+/, '').trim();
function parseTrackLines(text, old) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  // a pasted Notion list: keep only the numbered track lines (any notes in between are ignored)
  const notion = lines.map(cleanNotion).map(l => l.match(NOTION_TRACK)).filter(Boolean);
  if (notion.length) {
    return notion.map((m, i) => { const prev = old && old[i]; return { id: prev ? prev.id : uid(), title: m[2].trim(), short: prev ? prev.short : '', ms: m[3] ? parseLen(m[3]) : (prev ? prev.ms : 0) }; });
  }
  return lines.map((l, i) => {
    const parts = l.split('|').map(s => s.trim());
    const title = parts[0], rest = parts.slice(1);
    const lenPart = rest.find(p => parseLen(p)), shortPart = rest.find(p => !parseLen(p));
    const prev = old && old[i];
    return { id: prev ? prev.id : uid(), title, short: shortPart || '', ms: lenPart ? parseLen(lenPart) : (prev ? prev.ms : 0) };
  });
}

function parseScoreLines(text) { // -> one array of scores per track line (null = no score)
  // post text writes 10\* for Discord, so a pasted \* is a plain star
  const tok = c => { c = c.trim().replace(/\\\*/g, '*'); if (c === '' || /^[–—-]$/.test(c)) return null; if (/^x$/i.test(c)) return 'x'; if (starLevel(c)) return c; return /^\d+([.,]\d+)?$/.test(c) && +c.replace(',', '.') <= 10 ? +c.replace(',', '.') : undefined; };
  return text.split('\n').map(l => l.replace(/`/g, '').trimEnd())
    .filter(l => l.trim() && !/^\s*\(?\s*(overall|without)/i.test(l))
    .map(l => {
      let cells;
      if (l.includes('\t')) { cells = l.split('\t'); const c0 = tok(cells[0]); if (typeof c0 !== 'number' && !starLevel(c0)) cells = cells.slice(1); }
      else { const part = (l.includes(':') ? l.slice(l.lastIndexOf(':') + 1) : l).trim(); cells = part ? part.split(/\s+/) : []; }
      return cells.map(tok).filter(v => v !== undefined);
    }).filter(v => v.length);
}
// Notion-style notes: "- **1. Art School (2:02) - 8**" followed by free-text note lines until the next numbered track.
// Matched by track number, so notes in between never shift anything.
function parseNotionBlocks(text) {
  const blocks = []; let cur = null;
  text.split('\n').forEach(raw => {
    const line = raw.replace(/\*\*|__/g, '').replace(/^\s*[-*•]\s+/, '').trim();
    // a star after a 10 survives bold: "- **1. Noro - 10****" = 10** (the last ** closes the bold)
    const tail = raw.trim().match(/(?:^|[\s\-–—:|])10(\*+)$/), bold = /^\s*(?:[-•]\s+|\*\s+)?(\*\*|__)/.test(raw);
    const st = tail ? tail[1].length - (bold && tail[1].length >= 2 ? 2 : 0) : 0;
    const m = line.replace(/\*+$/, '').trim().match(/^(\d{1,3})[.)]\s*(.+?)(?:\s*\((\d{1,2}:\d{2})\))?\s*[-–—:|]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:\/\s*10)?$/);
    if (m && +m[4].replace(',', '.') <= 10) { cur = { num: +m[1], title: m[2].trim(), ms: parseLen(m[3] || ''), score: (st === 1 || st === 2) && +m[4] === 10 ? '10' + '*'.repeat(st) : +m[4].replace(',', '.'), note: [] }; blocks.push(cur); }
    else if (cur && line) cur.note.push(line);
  });
  return blocks.map(b => ({ ...b, note: b.note.join('\n') }));
}
function pasteMapped() {
  const al = album(), P = slot().people, start = +$('#ps_start').value, text = $('#ps_text').value;
  const notion = parseNotionBlocks(text);
  if (notion.length) { // one person's scores (+ notes), placed by track number
    const p = P[start];
    return { lines: notion, notion: true, map: al.tracks.map((t, i) => { const b = notion.find(x => x.num === i + 1); return b && p ? { [p.id]: b.score } : {}; }),
      notes: al.tracks.map((t, i) => notion.find(x => x.num === i + 1) || null) };
  }
  const lines = parseScoreLines(text);
  return { lines, map: al.tracks.map((t, i) => { const o = {}; (lines[i] || []).forEach((v, j) => { const p = P[start + j]; if (p) o[p.id] = v; }); return o; }) };
}

    <tbody>${al.tracks.map((t, i) => { const v = P.map(p => sc(al, p.id, t.id)), h = v.filter(x => x != null);
      return `<tr><td class="num">${i + 1}</td><td>${esc(t.title)}</td><td class="muted">${fmtLen(t.ms)}</td>${v.map((x, j) => `<td class="sv" style="color:${P[j].color}">${x == null ? (skipped(al, P[j].id, t.id) ? 'x' : '–') : fmtSc(x, scStars(al, P[j].id, t.id))}</td>`).join('')}${avgCol ? `<td class="sv" style="color:${PAL.both}">${h.length ? fmtNum(avg(h)) : '–'}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`;
}
function staticAlbumHead(al, b) {

let EXPORTING = false; // while true, album cards render as jump links instead of app buttons
// live summary for the pinned bar: each person's average + median for what's counted right now
function staticSummary(b, als, P, whole) {

function viewerData(b, als, pids) {
  const sl = slot(), keep = o => Object.fromEntries(Object.entries(o || {}).filter(([k]) => pids.includes(k)));

  const band = { id: b.id, name: b.name, best: keep(b.best), albums, relScope: b.relScope, hiddenAlbums: (b.hiddenAlbums || []).filter(id => als.some(a => a.id === id)) };

  return { v: 1, slots: [{ id: sl.id, name: people.map(p => p.name).join(' & '), people, bands: [band], view: {} }],
    cur: { slot: sl.id, band: b.id, album: null }, ui: Object.assign({}, S.ui, { simple: false }) };
}

function ensureMe(then) { // sharing needs to know which person is you, so their copy never overwrites your scores

async function shareOut(sl, bands, label) {
  const clean = JSON.parse(JSON.stringify({ id: sl.id, name: sl.name, people: sl.people, cmp: sl.cmp, bands }));
  const payload = { type: 'albumduel-share', v: 1, from: person(sl.me)?.name || '', at: Date.now(), slot: clean };
  const name = `album-duel-${label}`.toLowerCase().replace(/[^\w-]+/g, '-') + '.json';
  const file = new File([JSON.stringify(payload)], name, { type: 'application/json' });
  closeModal();
  if (navigator.canShare && navigator.canShare({ files: [file] })) { // phones: open the share sheet (WhatsApp, Discord…)
    try { await navigator.share({ files: [file], title: 'Album Duel: ' + label }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click();
  toast('Saved. Send the file to them, then they tap “Load file”');
}

  modal(`<h2>${d.from ? esc(d.from) + ' shared' : 'Shared'} “${esc(ss.name)}”</h2>
    <p class="muted small">${ss.bands.map(b => esc(b.name)).join(', ')} · ${albums} album${albums === 1 ? '' : 's'}. This becomes a new slot in your app. Which person is you? Your scores stay yours whenever it's shared again.</p>
    <div id="is_me">${ss.people.map((p, i) => `<label class="row" style="margin:8px 0"><input type="radio" name="is_me" value="${p.id}" ${i === guess ? 'checked' : ''} style="width:auto"><b style="color:${p.color}">${esc(p.name)}</b></label>`).join('')}
      <label class="row" style="margin:8px 0"><input type="radio" name="is_me" value="" style="width:auto"><span class="muted">None of these</span></label></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-act="isGo">Add it</button></div>`);
}

// ---------- events ----------
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal();
  const t = e.target;
  if (t.matches && t.matches('input.score, input.hscore') && ['Enter', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const r = +t.dataset.row + (e.key === 'ArrowUp' ? -1 : 1);
    const next = $(`input.${t.classList.contains('hscore') ? 'hscore' : 'score'}[data-row="${r}"][data-col="${t.dataset.col}"]`);
    if (next) { next.focus(); next.select(); }
  }
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input.score, input.hscore')) e.target.select(); });
// History table: numbers refresh a moment after typing stops, and the box being typed in keeps focus
let histT;
function histRefresh() {
  clearTimeout(histT);
  histT = setTimeout(() => {
    const a = document.activeElement, key = a && a.matches && a.matches('input.hscore') ? `input.hscore[data-lid="${a.dataset.lid}"][data-tid="${a.dataset.tid}"]` : null;
    rerender(); if (key) { const n = $(key); if (n) n.focus(); }
  }, 900);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('input.score')) {
    const al = album(), v = parseScoreText(t.value);
    al.scores[t.dataset.pid] = al.scores[t.dataset.pid] || {};
    if (v === undefined) { t.classList.add('bad'); return; }
    if (v === '') delete al.scores[t.dataset.pid][t.dataset.tid]; else al.scores[t.dataset.pid][t.dataset.tid] = v;
    t.classList.remove('bad'); save(); updateDerived(); renderSide();
  } else if (t.matches('input.hscore')) {
    const al = album(), L = (al.history?.[vis()[0].id] || []).find(x => x.id === t.dataset.lid); if (!L) return;
    const v = parseScoreText(t.value);
    if (v === undefined || v === 'x') { t.classList.add('bad'); return; }
    if (v === '') delete L.scores[t.dataset.tid]; else L.scores[t.dataset.tid] = v;
    t.classList.remove('bad'); save(); histRefresh();
  } else if (t.matches('.best-in')) {
    const obj = bestTarget(); obj.best = obj.best || {}; obj.best[t.dataset.pid] = obj.best[t.dataset.pid] || {};
    obj.best[t.dataset.pid][t.dataset.k] = t.value; save();
    const m = $('#m_' + t.dataset.k); if (m) m.textContent = matchBadge(obj, t.dataset.k, vis());
  } else if (t.id === 'bandSearch') { // re-render the list but keep typing uninterrupted
    S.ui.bandQ = t.value; const pos = t.selectionStart; renderSide();
    const n = $('#bandSearch'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
  } else if (t.id === 'dc_min') { S.ui.diffMin = +t.value || 0; save(); refreshDiscord(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'slotSel') {
    S.cur.slot = t.value; const sl = slot(); S.cur.band = sl.bands[0]?.id || null; S.cur.album = sl.bands[0] ? sortedAlbums(sl.bands[0])[0]?.id || null : null; save(); renderAll();
  } else if (t.id === 'viewMode' || t.id === 'viewN') {
    const sl = slot(); sl.view = sl.view || {};
    if (t.id === 'viewMode') sl.view.mode = t.value; else sl.view.n = Math.max(1, +t.value || 1);
    save(); renderAll();
  }
  else if (t.id === 'dropMode') { S.ui.dropMode = t.value; save(); renderAll(); }

  else if (t.id === 'tiesToggle') { S.ui.ties = t.checked; save(); renderAll(); }
  else if (t.classList.contains('listen-sel')) { const al = album(); al.listen = al.listen || {}; if (t.value) al.listen[t.dataset.pid] = t.value; else delete al.listen[t.dataset.pid]; save(); $('#overallCards').innerHTML = overallCards(al); }
  else if (t.classList.contains('hdate')) { const L = (album().history?.[vis()[0].id] || []).find(x => x.id === t.dataset.lid); if (L && t.value) { L.date = t.value; save(); } rerender(); }
  else if (t.id === 'hNowDate') { const al = album(), pid = vis()[0].id; al.listenDate = al.listenDate || {}; if (t.value) al.listenDate[pid] = t.value; else delete al.listenDate[pid]; save(); rerender(); }
  else if (t.classList.contains('dc')) { S.ui.dc[t.dataset.k] = t.checked; save(); refreshDiscord(); }
  else if (t.id === 'dc_layout') { S.ui.layout = t.value; save(); refreshDiscord(); }
  else if (t.id === 'dc_avg') { S.ui.dcAvg = t.checked; save(); refreshDiscord(); }
  else if (t.id === 'dc_names') { S.ui.names = t.value; save(); refreshDiscord(); }
  else if (t.id === 'dc_drop') { S.ui.drop = +t.value; save(); renderSide(); refreshDiscord(); }
  else if (t.id === 'fileIn' && t.files[0]) {
    try {
      const d = JSON.parse(await t.files[0].text());
      if (d.type === 'albumduel-share') { importShare(d); t.value = ''; return; }
      if (!d.slots) throw new Error('not a backup');
      if (!S.slots.length) { S = d; S.ui = Object.assign(defaultUi(), d.ui || {}); save(); renderAll(); toast('Backup loaded'); t.value = ''; return; }
      const replace = confirm('Replace everything with this backup?\n\nOK = replace all\nCancel = add its slots next to yours');
      if (replace) { S = d; S.ui = Object.assign(defaultUi(), d.ui || {}); }
      else d.slots.forEach(s => { if (S.slots.some(x => x.id === s.id)) { s.id = uid(); s.name += ' (imported)'; } S.slots.push(s); });
      save(); renderAll(); toast('Backup loaded');
    } catch (err) { toast('That file is not an Album Duel file'); }
    t.value = '';
  } else if (t.id === 'coverIn' && t.files[0]) {
    const url = URL.createObjectURL(t.files[0]);
    try { album().cover = await imgToDataUrl(url, 500); save(); closeModal(); renderAll(); } catch (err) { toast('Could not read that image'); }
    URL.revokeObjectURL(url); t.value = '';
  }
});

// ---------- boot ----------
S = load();
if (S.slots.length && !S.slots.some(s => s.id === S.cur.slot)) S.cur.slot = S.slots[0].id;
if (EMB && EMB.blank) document.body.classList.add('hosted');
renderAll();
hydrateCovers().then(autoFetchAll);
</script>
</body>
</html>
